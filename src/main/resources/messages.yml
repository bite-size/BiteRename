prefix: '<#FF0368>[BiteRename] '
error-prefix: '<#F7567C>!! '
# Variables:
# - <label> = command label.
# - <max> = configured limit (characters, lore lines, or templates).
# - <line> = lore line number.
# - <cost> = cost of an action (e.g. "$10.00" or "5").
# - <template> = name of a template.
# - <templates> = list of your templates.

errors:
  no-permission: '<#F7567C>No permission.'
